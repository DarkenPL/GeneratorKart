# Buduje aplikację „Generator kart” na macOS (Apple Silicon) i testuje ją na przykładach.
# - każda zmiana w main  → wydanie „Najnowsza wersja” (link w README zawsze wskazuje na nią),
# - tag v* albo wydanie opublikowane na GitHubie → plik dołączony do tego wydania,
# - pull request → tylko budowanie i testy (plik w Artifacts).
name: Aplikacja macOS

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['app/**', 'przyklady/**', '.github/workflows/aplikacja-mac.yml']
  pull_request:
    paths: ['app/**', 'przyklady/**', '.github/workflows/aplikacja-mac.yml']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: aplikacja-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Zależności
        run: npm ci

      - name: Zasoby (generator, przykłady, biblioteki, czcionki)
        run: npm run zasoby

      - name: Budowanie (Apple Silicon)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dir --arm64

      - name: Podpis ad hoc (bez konta Apple Developer)
        run: |
          app="dist/mac-arm64/Generator kart.app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"

      - name: Test – przykłady
        run: |
          mkdir -p "$RUNNER_TEMP/test"
          bin="dist/mac-arm64/Generator kart.app/Contents/MacOS/Generator kart"
          for ex in ../przyklady/*/; do
            n=$(basename "$ex")
            cp -R "$ex" "$RUNNER_TEMP/$n"                 # kopia: test zapisuje też folder Export
            "$bin" --user-data-dir="$RUNNER_TEMP/ud" --test-pdf "$RUNNER_TEMP/$n" "$RUNNER_TEMP/test/$n.pdf" | tee "$RUNNER_TEMP/test/$n.json"
            grep -q '"ok":true' "$RUNNER_TEMP/test/$n.json"
          done
          "$bin" --user-data-dir="$RUNNER_TEMP/ud" --test-pdf - "$RUNNER_TEMP/test/start.pdf"

      - name: DMG (okno „przeciągnij do Programów”)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg --arm64 --prepackaged "dist/mac-arm64/Generator kart.app"

      - name: Sprawdzenie DMG
        run: |
          ls -la dist/*.dmg
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" dist/Generator-kart.dmg
          ls -la "$RUNNER_TEMP/dmg"
          codesign --verify --deep --strict "$RUNNER_TEMP/dmg/Generator kart.app"
          test -L "$RUNNER_TEMP/dmg/Applications"
          hdiutil detach "$RUNNER_TEMP/dmg"

      - uses: actions/upload-artifact@v6
        with:
          name: Generator-kart
          path: app/dist/Generator-kart.dmg
          compression-level: 0

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: wyniki-testow
          path: ${{ runner.temp }}/test

      - name: Wydanie „Najnowsza wersja” (zmiana w main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete najnowsza --yes --cleanup-tag 2>/dev/null || true
          gh release create najnowsza dist/Generator-kart.dmg --latest --target "$GITHUB_SHA" \
            --title "Generator kart – najnowsza wersja" \
            --notes "Aplikacja na macOS (Apple Silicon: M1–M4), zbudowana z $(git rev-parse --short HEAD). Pierwsze uruchomienie: prawy przycisk → Otwórz (instrukcja: docs/aplikacja.md)."

      - name: Wydanie – nowy tag v*
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Generator-kart.dmg \
            --title "Generator kart $GITHUB_REF_NAME" \
            --notes "Aplikacja na macOS (Apple Silicon: M1–M4). Pierwsze uruchomienie: docs/aplikacja.md."

      - name: Wydanie – opublikowane na GitHubie (dołącza plik)
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/Generator-kart.dmg --clobber
