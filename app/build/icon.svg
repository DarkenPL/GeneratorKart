<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tlo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a6b8c"/>
      <stop offset="1" stop-color="#1f3d55"/>
    </linearGradient>
    <filter id="cien" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- tło w kształcie ikony macOS (margines 100 px jak w szablonie Apple) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tlo)"/>
  <g filter="url(#cien)">
    <!-- trzy karty w wachlarzu, proporcje 63×88 -->
    <g transform="translate(512 645) rotate(-20)">
      <rect x="-150" y="-380" width="300" height="419" rx="30" fill="#E8A15A" stroke="#fff" stroke-width="16"/>
    </g>
    <g transform="translate(512 645) rotate(20)">
      <rect x="-150" y="-380" width="300" height="419" rx="30" fill="#7BA05B" stroke="#fff" stroke-width="16"/>
    </g>
    <g transform="translate(512 645)">
      <rect x="-150" y="-400" width="300" height="419" rx="30" fill="#ffffff"/>
      <rect x="-118" y="-368" width="236" height="355" rx="16" fill="none" stroke="#C0504D" stroke-width="12"/>
      <!-- gwiazda na środku karty -->
      <path transform="translate(0 -190) scale(1.15)" fill="#C0504D"
        d="M0,-80 L23.5,-32.4 L76.1,-24.7 L38,12.4 L47,64.7 L0,40 L-47,64.7 L-38,12.4 L-76.1,-24.7 L-23.5,-32.4 Z"/>
    </g>
  </g>
</svg>
